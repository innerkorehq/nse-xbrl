[project]
name = "nse-xbrl"
version = "0.1.0"
description = "Async Python 3.14 library for parsing XBRL Filing Information of NSE & BSE across all taxonomies"
readme = "README.md"
authors = [
    { name = "innerkorehq" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "lxml>=5.2.0",
    "pydantic>=2.7.0",
    "python-dateutil>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/innerkorehq/nse-xbrl"
Documentation = "https://innerkorehq.github.io/nse-xbrl/"
Repository = "https://github.com/innerkorehq/nse-xbrl"
Issues = "https://github.com/innerkorehq/nse-xbrl/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.22.0",
    "sphinx>=9.1.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
    "sphinxcontrib-mermaid>=2.1.1",
]
